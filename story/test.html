<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>捲動效能測試 — 影片 vs 圖片序列</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--cream:#fdf8f0;--ink:#2f2620;--teal:#4A8E97;--dim:#8c827a;}
body{background:var(--cream);font-family:'Zen Maru Gothic','Noto Sans TC',sans-serif;color:var(--ink);}
.stage{position:fixed;inset:0;z-index:1;overflow:hidden;background:var(--cream);}
.stage video,.stage canvas{width:100%;height:100%;object-fit:cover;display:block;}
.stage .layer{position:absolute;inset:0;}
.hidden{display:none;}

/* 上方：模式切換 */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;gap:8px;justify-content:center;
  padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;background:rgba(253,248,240,.9);
  backdrop-filter:blur(8px);border-bottom:1px solid rgba(139,94,60,.12);}
.bar button{font-family:inherit;font-size:14px;font-weight:500;padding:9px 18px;border-radius:22px;
  border:1px solid rgba(61,43,31,.2);background:#fff;color:var(--ink);cursor:pointer;}
.bar button.on{background:var(--ink);color:#fff;border-color:var(--ink);}

/* 下方：即時數據 */
.stats{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border:1px solid rgba(139,94,60,.16);
  border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.75;
  box-shadow:0 8px 24px rgba(61,43,31,.14);}
.stats b{font-size:19px;color:var(--teal);}
.stats .row{display:flex;justify-content:space-between;gap:10px;}
.stats .hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5;}
.reset{float:right;font-size:11px;padding:4px 12px;border-radius:14px;border:1px solid rgba(61,43,31,.2);
  background:#fff;font-family:inherit;cursor:pointer;}

.caption{position:fixed;left:16px;top:44%;z-index:20;max-width:78vw;}
.caption .t{font-size:12px;letter-spacing:.2em;color:var(--teal);margin-bottom:8px;}
.caption h1{font-size:26px;font-weight:700;line-height:1.45;text-shadow:0 1px 14px var(--cream),0 0 28px var(--cream);}
.space{position:relative;z-index:0;height:600vh;}
.load{position:fixed;inset:0;z-index:40;background:var(--cream);display:flex;align-items:center;
  justify-content:center;font-size:14px;letter-spacing:.15em;color:var(--dim);}
.load.gone{display:none;}
</style>
</head>
<body>

<div class="load" id="load">準備中… <span id="loadPct"></span></div>

<div class="stage">
  <div class="layer" id="videoLayer">
    <video id="vid" muted playsinline preload="auto"></video>
  </div>
  <div class="layer hidden" id="imgLayer">
    <canvas id="cv" width="480" height="854"></canvas>
  </div>
</div>

<div class="caption">
  <div class="t">04 / 07　效能測試</div>
  <h1>亮起的那盞燈，<br>是有人在等你。</h1>
</div>

<div class="bar">
  <button id="bVideo" class="on">影片版</button>
  <button id="bImg">圖片序列版</button>
</div>

<div class="stats">
  <div class="row"><span>目前模式</span><b id="sMode">影片版</b></div>
  <div class="row"><span>畫面每秒真的更新</span><b id="sFps">—</b></div>
  <div class="row"><span>畫面凍住次數（超過 0.2 秒）</span><b id="sStall">0</b></div>
  <div class="row"><span>最久凍住</span><b id="sWorst">0 ms</b></div>
  <div class="hint">上下滑動五、六秒，兩個模式各測一次，然後截圖給我。
    這次量的是「螢幕真的換畫面幾次」，數字越高越順。
    <button class="reset" id="bReset">歸零</button></div>
</div>

<div class="space"></div>

<script>
const CLOUD='https://res.cloudinary.com/ddzync8km/video/upload';
const SCENE='story/s2';        // 04/07「等你回來」＝你爸手機上空白的那一幕
const DUR=10, FRAMES=60;       // 影片 10 秒，抽 60 格（每格約 10vh 捲動距離）
const TF='w_480,h_854,c_fill,q_60,f_webp';

const vid=document.getElementById('vid'), cv=document.getElementById('cv'), ctx=cv.getContext('2d',{alpha:false});
const videoLayer=document.getElementById('videoLayer'), imgLayer=document.getElementById('imgLayer');
const load=document.getElementById('load'), loadPct=document.getElementById('loadPct');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ── 載入素材 ──
vid.src=`${CLOUD}/w_480,h_854,c_fill,ki_0.07,q_60/${SCENE}.mp4`;
const imgs=[]; let ready=0;
for(let i=0;i<FRAMES;i++){
  const im=new Image();
  im.src=`${CLOUD}/so_${(i*DUR/FRAMES).toFixed(2)},${TF}/${SCENE}.webp`;
  im.onload=im.onerror=()=>{ ready++; loadPct.textContent=Math.round(ready/FRAMES*100)+'%';
    if(ready===FRAMES) load.classList.add('gone'); };
  imgs.push(im);
}
setTimeout(()=>load.classList.add('gone'),8000);   // 保險：最多等 8 秒

// ── 模式 ──
let mode='video';
function setMode(m){
  mode=m;
  videoLayer.classList.toggle('hidden',m!=='video');
  imgLayer.classList.toggle('hidden',m!=='img');
  document.getElementById('bVideo').classList.toggle('on',m==='video');
  document.getElementById('bImg').classList.toggle('on',m==='img');
  document.getElementById('sMode').textContent=m==='video'?'影片版':'圖片序列版';
  reset(); draw();
}
document.getElementById('bVideo').onclick=()=>setMode('video');
document.getElementById('bImg').onclick=()=>setMode('img');

// ── 效能量測 ──
// 重點：量「螢幕真的更新了幾次」，不是「程式跑了幾次」。
// 影片模式下 currentTime 設下去會立刻回傳，但解碼器可能沒把畫面交出來，
// 用程式執行次數會量到假的高分（上一版就是這樣量錯的）。
let lastPaint=0, stalls=0, worst=0, paints=0, winStart=0, scrolling=false, scrollEnd=0, lastIdx=-1;
function reset(){ stalls=0; worst=0; paints=0; winStart=performance.now(); lastPaint=0; lastIdx=-1;
  document.getElementById('sStall').textContent='0';
  document.getElementById('sWorst').textContent='0 ms';
  document.getElementById('sFps').textContent='—'; }
document.getElementById('bReset').onclick=reset;

// 螢幕真的換了一張畫面時呼叫
function onPaint(){
  const now=performance.now();
  if(!scrolling){ lastPaint=now; return; }
  if(lastPaint){
    const gap=now-lastPaint;
    if(gap>200){ stalls++; worst=Math.max(worst,gap);
      document.getElementById('sStall').textContent=stalls;
      document.getElementById('sWorst').textContent=Math.round(worst)+' ms'; }
  }
  lastPaint=now; paints++;
  const el=(now-winStart)/1000;
  if(el>=1){ document.getElementById('sFps').textContent=(paints/el).toFixed(1);
    paints=0; winStart=now; }
}

// 影片：requestVideoFrameCallback 只在新畫面真的送到螢幕時才觸發
const hasRVFC = typeof vid.requestVideoFrameCallback === 'function';
function pumpRVFC(){
  if(!hasRVFC) return;
  vid.requestVideoFrameCallback(()=>{ if(mode==='video') onPaint(); pumpRVFC(); });
}
pumpRVFC();

function progress(){
  const max=document.body.scrollHeight-innerHeight;
  return clamp(scrollY/max,0,1);
}

function draw(){
  const p=progress();
  if(mode==='video'){
    if(isFinite(vid.duration)) { try{ vid.currentTime=p*(vid.duration-0.05); }catch(e){} }
    if(!hasRVFC) onPaint();          // 舊瀏覽器沒有 rVFC，只能退回舊算法
  }else{
    const i=Math.min(FRAMES-1,Math.floor(p*FRAMES));
    if(i!==lastIdx){                  // 只有真的換圖才算一次更新
      const im=imgs[i];
      if(im && im.complete && im.naturalWidth){ ctx.drawImage(im,0,0,cv.width,cv.height); lastIdx=i; onPaint(); }
    }
  }
}

let raf=false;
addEventListener('scroll',()=>{
  scrolling=true; clearTimeout(scrollEnd);
  scrollEnd=setTimeout(()=>{ scrolling=false; last=0; },250);
  if(raf) return; raf=true;
  requestAnimationFrame(()=>{ raf=false; draw(); });
},{passive:true});

vid.addEventListener('loadeddata',draw,{once:true});
draw();
</script>
</body>
</html>
