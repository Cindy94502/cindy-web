name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'  # 每天台灣早上5點重新產生分享頁

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 改網站（push）時不抓實價登錄，太慢而且跟這次改的東西無關，
      # 直接沿用版控裡的 public/market-data.json。
      # 每天早上 5 點的排程照抓，所以行情最慢隔天早上就會更新回來。
      # 想立刻更新行情：到 GitHub 的 Actions 頁按 Run workflow（手動觸發也會抓）。
      - name: Generate market data
        if: github.event_name != 'push'
        run: node scripts/generate-market-data.mjs

      - name: Build
        run: npm run build

      - name: Generate OG share pages
        run: node scripts/generate-og-pages.mjs

      - name: Generate blog pages
        run: node scripts/generate-blog-pages.mjs

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
